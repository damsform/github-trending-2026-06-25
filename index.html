<style>
:root {
  --canvas: #FAF7F2;
  --surface: #FFFFFF;
  --border: #E8E4DD;
  --text-primary: #2F3437;
  --text-secondary: #6B6B6B;
  --text-muted: #9B9B9B;
  --accent-green-text: #346538;
  --accent-pale-green: #EDF3EC;
  --accent-blue-text: #1F6C9F;
  --accent-pale-blue: #E1F3FE;
  --accent-orange-text: #8B5A2B;
  --accent-pale-orange: #FFF3E0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--canvas);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
}
.carousel {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}
.slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  opacity: 0;
  transform: translateX(60px);
  transition: opacity 0.5s ease, transform 0.5s ease;
  pointer-events: none;
}
.slide.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}
.slide.prev {
  opacity: 0;
  transform: translateX(-60px);
}
.slide-left {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
  background: #F5F1EB;
}
.slide-left img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
}
.fallback {
  width: 320px;
  height: 320px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Newsreader', serif;
  font-size: 120px;
  font-weight: 700;
  color: rgba(255,255,255,0.9);
  text-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.slide-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 48px 64px;
  overflow-y: auto;
}
.badge-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.lang-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
}
.lang-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}
.trend-badge {
  font-size: 12px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 12px;
}
.trend-badge.hot { background: var(--accent-pale-orange); color: var(--accent-orange-text); }
.trend-badge.warm { background: var(--accent-pale-blue); color: var(--accent-blue-text); }
.trend-badge.cool { background: #F0F0F0; color: var(--text-secondary); }
.category-badge {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 12px;
  background: var(--accent-pale-green);
  color: var(--accent-green-text);
}
.repo-name {
  font-family: 'Newsreader', serif;
  font-size: 36px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 12px;
  color: var(--text-primary);
}
.repo-name a {
  color: inherit;
  text-decoration: none;
}
.one-liner {
  font-size: 16px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 20px;
}
.topics {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.topic-tag {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 12px;
  background: var(--accent-pale-blue);
  color: var(--accent-blue-text);
}
.stars-row {
  display: flex;
  gap: 24px;
  align-items: baseline;
  margin-bottom: 20px;
}
.stars-total {
  font-size: 28px;
  font-weight: 600;
  color: var(--text-primary);
}
.stars-today {
  font-size: 16px;
  font-weight: 500;
  color: var(--accent-green-text);
  background: var(--accent-pale-green);
  padding: 4px 12px;
  border-radius: 8px;
}
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.stat-item {
  font-size: 13px;
  color: var(--text-secondary);
}
.stat-item strong {
  color: var(--text-primary);
  font-weight: 500;
}
.activity-bar {
  width: 100%;
  height: 6px;
  background: #EEE;
  border-radius: 3px;
  margin-top: 4px;
  overflow: hidden;
}
.activity-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.8s ease;
}
.avatars-row {
  display: flex;
  align-items: center;
  margin-bottom: 16px;
}
.avatars-row img {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--canvas);
  margin-left: -6px;
}
.avatars-row img:first-child { margin-left: 0; }
.nav-hint {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}
.list-btn {
  position: fixed;
  top: 24px;
  right: 24px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  z-index: 100;
  transition: transform 0.2s;
}
.list-btn:hover { transform: scale(1.05); }
.list-btn svg { width: 20px; height: 20px; stroke: var(--text-secondary); }
.drawer-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.3);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 200;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: 420px;
  height: 100%;
  background: var(--canvas);
  transform: translateX(100%);
  transition: transform 0.35s ease;
  z-index: 201;
  overflow-y: auto;
  padding: 24px;
}
.drawer.open { transform: translateX(0); }
.drawer-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.drawer-header h2 {
  font-family: 'Newsreader', serif;
  font-size: 22px;
  font-weight: 600;
}
.drawer-close {
  width: 32px;
  height: 32px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 20px;
  color: var(--text-muted);
}
.drawer-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.drawer-item:last-child { border-bottom: none; }
.drawer-repo {
  font-weight: 500;
  font-size: 14px;
  margin-bottom: 4px;
}
.drawer-repo a { color: var(--text-primary); text-decoration: none; }
.drawer-desc {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.drawer-meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--text-muted);
}
.slide-counter {
  position: fixed;
  top: 28px;
  left: 28px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text-muted);
  z-index: 50;
}
@media (max-width: 768px) {
  .slide { flex-direction: column; }
  .slide-left { flex: none; height: 40vh; padding: 24px; }
  .slide-right { padding: 24px; }
  .repo-name { font-size: 24px; }
  .drawer { width: 100%; }
  .slide-left .fallback { width: 200px; height: 200px; font-size: 80px; }
}

const LANG_COLORS = {"Python": "#3572A5", "Rust": "#dea584", "TypeScript": "#3178c6", "JavaScript": "#f1e05a", "Go": "#00ADD8", "Swift": "#F05138", "Shell": "#89e051", "HTML": "#e34c26", "Kotlin": "#A97BFF", "Dart": "#00B4AB", "Batchfile": "#999", "Haskell": "#5e5086"};

let currentSlide = 0;
let touchStartX = 0;
let touchDeltaX = 0;

function getTrendClass(label) {
  if (label.includes('爆发') || label.includes('高速')) return 'hot';
  if (label.includes('稳步')) return 'warm';
  return 'cool';
}

function getLangColor(lang) {
  return LANG_COLORS[lang] || '#999';
}

function getScoreColor(score) {
  if (score >= 60) return '#346538';
  if (score >= 30) return '#8B5A2B';
  return '#9B9B9B';
}

function buildSlides() {
  const carousel = document.getElementById('carousel');
  DATA.forEach((repo, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide' + (i === 0 ? ' active' : '');
    slide.dataset.index = i;
    
    const ogImg = repo.ogImage || '';
    const initial = repo.repo.split('/')[1]?.[0]?.toUpperCase() || '?';
    const langColor = getLangColor(repo.language);
    
    const topics = (repo.topics || []).slice(0, 6).map(t => 
      `<span class="topic-tag">${t.name || t}</span>`
    ).join('');
    
    const avatars = (repo.contributorAvatars || []).map(url => 
      `<img src="${url}" alt="" loading="lazy" onerror="this.style.display='none'">`
    ).join('');
    
    slide.innerHTML = `
      <div class="slide-left">
        ${ogImg 
          ? `<img src="${ogImg}" alt="${repo.repo}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\'fallback\' style=\'background:${langColor}\'>${initial}</div>'">`
          : `<div class="fallback" style="background:${langColor}">${initial}</div>`
        }
      </div>
      <div class="slide-right">
        <div class="badge-row">
          <span class="lang-badge"><span class="lang-dot" style="background:${langColor}"></span>${repo.language || 'N/A'}</span>
          <span class="trend-badge ${getTrendClass(repo.trendLabel)}">${repo.trendLabel}</span>
          <span class="category-badge">${repo.categoryTag}</span>
        </div>
        <h1 class="repo-name"><a href="${repo.url}" target="_blank">${repo.repo}</a></h1>
        <p class="one-liner">${repo.descZh || repo.description || ''}</p>
        ${topics ? `<div class="topics">${topics}</div>` : ''}
        <div class="stars-row">
          <span class="stars-total">⭐ ${(repo.totalStars || 0).toLocaleString()}</span>
          <span class="stars-today">+${(repo.starsToday || 0).toLocaleString()} today</span>
        </div>
        ${avatars ? `<div class="avatars-row">${avatars}${repo.contributors > 5 ? `<span style="font-size:12px;color:var(--text-muted);margin-left:8px">+${repo.contributors - 5} more</span>` : ''}</div>` : ''}
        <div class="stats-grid">
          <div class="stat-item">活跃度 <strong>${repo.activityScore || 0}/100</strong>
            <div class="activity-bar"><div class="activity-fill" style="width:${repo.activityScore || 0}%;background:${getScoreColor(repo.activityScore || 0)}"></div></div>
          </div>
          <div class="stat-item">Issues <strong>${repo.openIssues || 0}</strong> · PRs <strong>${repo.openPRs || 0}</strong></div>
          ${repo.releaseVersion ? `<div class="stat-item">版本 <strong>${repo.releaseVersion}</strong></div>` : ''}
          ${repo.lastCommit ? `<div class="stat-item">最近提交 <strong>${new Date(repo.lastCommit).toLocaleDateString('zh-CN')}</strong></div>` : ''}
        </div>
      </div>
    `;
    carousel.appendChild(slide);
  });
}

function goToSlide(index) {
  const slides = document.querySelectorAll('.slide');
  if (index < 0 || index >= slides.length) return;
  
  slides.forEach((s, i) => {
    s.classList.remove('active', 'prev');
    if (i === index) s.classList.add('active');
    else if (i < index) s.classList.add('prev');
  });
  
  currentSlide = index;
  document.getElementById('current').textContent = index + 1;
}

function toggleDrawer() {
  document.getElementById('overlay').classList.toggle('open');
  document.getElementById('drawer').classList.toggle('open');
}

function buildDrawer() {
  const list = document.getElementById('drawer-list');
  ALL_REPOS.forEach(repo => {
    const item = document.createElement('div');
    item.className = 'drawer-item';
    item.innerHTML = `
      <div class="drawer-repo">
        <a href="${repo.url}" target="_blank">${repo.repo}</a>
      </div>
      <div class="drawer-desc">${repo.description || ''}</div>
      <div class="drawer-meta">
        <span><span class="lang-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${getLangColor(repo.language)};vertical-align:middle;margin-right:4px"></span>${repo.language || 'N/A'}</span>
        <span>⭐${(repo.totalStars || 0).toLocaleString()}</span>
        <span style="color:var(--accent-green-text)">+${(repo.starsToday || 0).toLocaleString()}</span>
      </div>
    `;
    list.appendChild(item);
  });
}

// Touch/mouse swipe
const carousel = document.getElementById('carousel');
carousel.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true});
carousel.addEventListener('touchend', e => {
  touchDeltaX = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(touchDeltaX) > 50) {
    goToSlide(currentSlide + (touchDeltaX < 0 ? 1 : -1));
  }
});
carousel.addEventListener('mousedown', e => { touchStartX = e.clientX; });
carousel.addEventListener('mouseup', e => {
  touchDeltaX = e.clientX - touchStartX;
  if (Math.abs(touchDeltaX) > 50) {
    goToSlide(currentSlide + (touchDeltaX < 0 ? 1 : -1));
  }
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToSlide(currentSlide + 1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goToSlide(currentSlide - 1);
  if (e.key === 'Escape') {
    if (document.getElementById('drawer').classList.contains('open')) toggleDrawer();
  }
});

// Init
buildSlides();
buildDrawer();
document.getElementById('total').textContent = DATA.length;
</script>
