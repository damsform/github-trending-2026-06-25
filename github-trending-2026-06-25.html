const LANG_COLORS = {"Python": "#3572A5", "Rust": "#dea584", "TypeScript": "#3178c6", "JavaScript": "#f1e05a", "Go": "#00ADD8", "Swift": "#F05138", "Shell": "#89e051", "HTML": "#e34c26", "Kotlin": "#A97BFF", "Dart": "#00B4AB", "Batchfile": "#999"};

let currentSlide = 0;
let touchStartX = 0;

function getTrendClass(l) {
  if (l.includes('爆发') || l.includes('高速')) return 'hot';
  if (l.includes('稳步')) return 'warm';
  return 'cool';
}

function getLangColor(l) { return LANG_COLORS[l] || '#999'; }

function getScoreColor(s) {
  if (s >= 60) return '#346538';
  if (s >= 30) return '#8B5A2B';
  return '#9B9B9B';
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildSlides() {
  const c = document.getElementById('carousel');
  DATA.forEach((r, i) => {
    const s = document.createElement('div');
    s.className = 'slide' + (i === 0 ? ' active' : '');
    const img = r.ogImage || '';
    const init = (r.repo.split('/')[1] || '?')[0].toUpperCase();
    const lc = getLangColor(r.language);
    const desc = esc(r.descZh || r.aboutDesc || r.description || '');

    let topicsHtml = '';
    const topics = (r.topics || []).slice(0, 6);
    if (topics.length) {
      topicsHtml = '<div class="topics">' + topics.map(t =>
        '<span class="topic-tag">' + esc(t.name || t) + '</span>'
      ).join('') + '</div>';
    }

    let avatarsHtml = '';
    const avatars = r.contributorAvatars || [];
    if (avatars.length) {
      avatarsHtml = '<div class="avatars-row">' + avatars.map(u =>
        '<img src="' + esc(u) + '" loading="lazy" onerror="this.style.display=\'none\'">'
      ).join('');
      if (r.contributors > 5) {
        avatarsHtml += '<span style="font-size:12px;color:var(--text-muted);margin-left:8px">+' + (r.contributors - 5) + ' more</span>';
      }
      avatarsHtml += '</div>';
    }

    let leftHtml;
    if (img) {
      leftHtml = '<img src="' + esc(img) + '" alt="' + esc(r.repo) + '" loading="lazy" onerror="this.outerHTML=\'<div class=\\\'fallback\\\' style=\\\'background:' + lc + '\\\'>' + init + '</div>\'">';
    } else {
      leftHtml = '<div class="fallback" style="background:' + lc + '">' + init + '</div>';
    }

    let extraStats = '';
    if (r.releaseVersion) extraStats += '<div class="stat-item">版本 <strong>' + esc(r.releaseVersion) + '</strong></div>';
    if (r.lastCommit) extraStats += '<div class="stat-item">最近提交 <strong>' + new Date(r.lastCommit).toLocaleDateString('zh-CN') + '</strong></div>';

    s.innerHTML =
      '<div class="slide-left">' + leftHtml + '</div>' +
      '<div class="slide-right">' +
        '<div class="badge-row">' +
          '<span class="lang-badge"><span class="lang-dot" style="background:' + lc + '"></span>' + esc(r.language || 'N/A') + '</span>' +
          '<span class="trend-badge ' + getTrendClass(r.trendLabel) + '">' + esc(r.trendLabel) + '</span>' +
          '<span class="category-badge">' + esc(r.categoryTag) + '</span>' +
        '</div>' +
        '<h1 class="repo-name"><a href="' + esc(r.url) + '" target="_blank">' + esc(r.repo) + '</a></h1>' +
        '<p class="one-liner">' + desc + '</p>' +
        topicsHtml +
        '<div class="stars-row">' +
          '<span class="stars-total">⭐ ' + (r.totalStars || 0).toLocaleString() + '</span>' +
          '<span class="stars-today">+' + (r.starsToday || 0).toLocaleString() + ' today</span>' +
        '</div>' +
        avatarsHtml +
        '<div class="stats-grid">' +
          '<div class="stat-item">活跃度 <strong>' + (r.activityScore || 0) + '/100</strong><div class="activity-bar"><div class="activity-fill" style="width:' + (r.activityScore || 0) + '%;background:' + getScoreColor(r.activityScore || 0) + '"></div></div></div>' +
          '<div class="stat-item">Issues <strong>' + (r.openIssues || 0) + '</strong> · PRs <strong>' + (r.openPRs || 0) + '</strong></div>' +
          extraStats +
        '</div>' +
      '</div>';
    c.appendChild(s);
  });
}

function goToSlide(i) {
  const ss = document.querySelectorAll('.slide');
  if (i < 0 || i >= ss.length) return;
  ss.forEach((s, j) => {
    s.classList.remove('active', 'prev');
    if (j === i) s.classList.add('active');
    else if (j < i) s.classList.add('prev');
  });
  currentSlide = i;
  document.getElementById('current').textContent = i + 1;
}

function toggleDrawer() {
  document.getElementById('overlay').classList.toggle('open');
  document.getElementById('drawer').classList.toggle('open');
}

function buildDrawer() {
  const l = document.getElementById('drawer-list');
  ALL_REPOS.forEach(r => {
    const d = document.createElement('div');
    d.className = 'drawer-item';
    d.innerHTML =
      '<div class="drawer-repo"><a href="' + esc(r.url) + '" target="_blank">' + esc(r.repo) + '</a></div>' +
      '<div class="drawer-desc">' + esc(r.description || '') + '</div>' +
      '<div class="drawer-meta">' +
        '<span><span class="lang-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + getLangColor(r.language) + ';vertical-align:middle;margin-right:4px"></span>' + esc(r.language || 'N/A') + '</span>' +
        '<span>⭐ ' + (r.totalStars || 0).toLocaleString() + '</span>' +
        '<span style="color:var(--accent-green-text)">+' + (r.starsToday || 0).toLocaleString() + '</span>' +
      '</div>';
    l.appendChild(d);
  });
}

// Touch/mouse swipe
const carousel = document.getElementById('carousel');
carousel.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
carousel.addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(d) > 50) goToSlide(currentSlide + (d < 0 ? 1 : -1));
});
carousel.addEventListener('mousedown', e => { touchStartX = e.clientX; });
carousel.addEventListener('mouseup', e => {
  const d = e.clientX - touchStartX;
  if (Math.abs(d) > 50) goToSlide(currentSlide + (d < 0 ? 1 : -1));
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToSlide(currentSlide + 1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goToSlide(currentSlide - 1);
  if (e.key === 'Escape' && document.getElementById('drawer').classList.contains('open')) toggleDrawer();
});

buildSlides();
buildDrawer();
document.getElementById('total').textContent = DATA.length;
</script>
